services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yii-music-catalog-backend-prod
    ports:
      - "8080:80"
    env_file:
      - .env.prod
    depends_on:
      - db
      - minio

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yii-music-catalog-queue-prod
    command: php yii queue/listen 3 --verbose
    env_file:
      - .env.prod
    depends_on:
      - db
      - minio

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yii-music-catalog-frontend-prod
    ports:
      - "5173:80"
    depends_on:
      - backend

  db:
    image: mariadb:11
    container_name: yii-music-catalog-db-prod
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data_prod:/var/lib/mysql

  minio:
    image: quay.io/minio/minio
    container_name: yii-music-catalog-minio-prod
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET}
    volumes:
      - minio_data_prod:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${S3_KEY}' '${S3_SECRET}' &&
      mc mb --ignore-existing local/music-catalog &&
      mc anonymous set download local/music-catalog
      "

volumes:
  db_data_prod:
  minio_data_prod: