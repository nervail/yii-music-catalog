server {
    listen 80;
    server_name 109.235.118.134;

    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name 109.235.118.134;

    ssl_certificate     /etc/letsencrypt/live/109.235.118.134/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/109.235.118.134/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(env|bak|old|sql|log)$ { deny all; }
    location ~* ^/(docker-compose(\..*)?|Dockerfile|phpinfo)$ { deny all; }

    # API: URI передаём как есть, Apache сам делает rewrite ^api/(.*)$ -> api.php
    location ^~ /api/ {
        client_max_body_size 50m;
        proxy_pass http://backend:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Публичные картинки из MinIO (path-style: /<bucket>/<key>)
    location ^~ /music-catalog/ {
        proxy_pass http://minio:9000;
        proxy_buffering off;
    }

    # React SPA
    location / { try_files $uri $uri/ /index.html; }
}

# Админка (тот же Apache)
server {
    listen 8443 ssl;
    server_name 109.235.118.134;

    ssl_certificate     /etc/letsencrypt/live/109.235.118.134/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/109.235.118.134/privkey.pem;

    client_max_body_size 50m;
    location / {
        proxy_pass http://backend:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
